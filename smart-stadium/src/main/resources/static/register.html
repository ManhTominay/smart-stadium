<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Smart Stadium</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            padding: 35px 30px;
        }
        .brand-title {
            color: #059669;
            font-weight: 700;
        }
        .btn-success-custom {
            background-color: #10b981;
            border: none;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-success-custom:hover {
            background-color: #059669;
        }
        .form-control:focus, .form-select:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.25);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-4">
        <h3 class="brand-title mb-1"> Smart Stadium</h3>
        <p class="text-muted small">Tạo tài khoản mới để trải nghiệm dịch vụ</p>
    </div>

    <form id="registerForm">
        <div class="mb-3">
            <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
            <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
            <input type="email" class="form-control" id="email" placeholder="example@gmail.com" required>
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label fw-semibold">Số điện thoại</label>
            <input type="tel" class="form-control" id="phone" placeholder="0912345678" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
            <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu (ít nhất 6 ký tự)" required>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
        </div>



        <button type="submit" class="btn btn-success-custom w-100 text-white mb-3">Tạo tài khoản</button>
    </form>

    <div class="text-center mt-3">
        <span class="text-muted small">Đã có tài khoản? </span>
        <a href="/login.html" class="text-decoration-none fw-semibold text-success">Đăng nhập</a>
    </div>

    <div class="text-center mt-3">
        <a href="/" class="text-decoration-none text-muted small">← Quay lại trang chủ</a>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value.trim();
        const confirmPassword = document.getElementById('confirmPassword').value.trim();

        if (password !== confirmPassword) {
            alert('Mật khẩu xác nhận không khớp!');
            return;
        }

        const userData = {
            username: email,    // Sử dụng email làm username
            fullName: fullName,
            email: email,
            phone: phone,
            password: password,
            role: "CUSTOMER"
        };

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(userData)
            });

            if (response.ok) {
                alert('Tạo tài khoản thành công!');
                window.location.href = '/login.html';
            } else {
                const errorMsg = await response.text();
                alert('Đăng ký thất bại: ' + errorMsg);
            }
        } catch (error) {
            console.error('Lỗi kết nối:', error);
            alert('Không thể kết nối đến máy chủ!');
        }
    });
</script>

</body>
</html>
