<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Smart Stadium</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
        }
        .brand-title {
            color: #059669;
            font-weight: 700;
        }
        .btn-success-custom {
            background-color: #10b981;
            border: none;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-success-custom:hover {
            background-color: #059669;
        }
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.25);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-4">
        <h3 class="brand-title mb-1"> Smart Stadium</h3>
        <p class="text-muted small">Đăng nhập tài khoản của bạn</p>
    </div>

    <form id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Tên đăng nhập / Email</label>
            <input type="text" class="form-control" id="username" placeholder="Nhập username hoặc email" required>
        </div>

        <!-- Ô nhập Mật khẩu -->
        <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
            <div class="input-group">
                <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                    👁️
                </button>
            </div>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label text-muted small" for="rememberMe">Ghi nhớ đăng nhập</label>
        </div>

        <button type="submit" class="btn btn-success-custom w-100 text-white mb-3">Đăng nhập</button>
    </form>

    <div class="text-center mt-3">
        <span class="text-muted small">Chưa có tài khoản? </span>
        <a href="/register.html" class="text-decoration-none fw-semibold text-success">Đăng ký ngay</a>
    </div>

    <div class="text-center mt-3">
        <a href="/" class="text-decoration-none text-muted small">← Quay lại trang chủ</a>
    </div>
</div>

<script>
    // 1. Xử lý Đăng nhập qua API Backend
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value.trim();

        if (!usernameInput || !passwordInput) {
            alert('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!');
            return;
        }

        try {
            // Gửi request đăng nhập lên Backend
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: usernameInput,
                    password: passwordInput
                })
            });

            if (response.ok) {
                const data = await response.json();

                // Lưu thông tin đăng nhập vào localStorage
                if (data.token) {
                    localStorage.setItem('token', data.token);
                }

                // Nếu backend trả về trực tiếp Object User hoặc nằm trong data.user
                const userData = data.user ? data.user : data;
                localStorage.setItem('currentUser', JSON.stringify(userData));
                localStorage.setItem('isLoggedIn', 'true');

                alert('Đăng nhập thành công!');

                // Kiểm tra phân quyền: Nếu là ADMIN thì vào trang quản trị, ngược lại về trang chủ
                if (userData.role && userData.role.toUpperCase() === 'ADMIN') {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/';
                }
            } else {
                const errorMsg = await response.text();
                alert(errorMsg || 'Tài khoản hoặc mật khẩu không chính xác!');
            }
        } catch (error) {
            console.error('Lỗi khi kết nối tới máy chủ:', error);
            alert('Không thể kết nối đến máy chủ. Vui lòng kiểm tra lại Backend Spring Boot!');
        }
    });

    // 2. Xử lý nút ẩn/hiện mật khẩu
    document.getElementById('togglePassword').addEventListener('click', function () {
        const passwordInput = document.getElementById('password');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text'; // Hiện mật khẩu
            this.textContent = '🙈';     // Đổi biểu tượng
        } else {
            passwordInput.type = 'password'; // Ẩn mật khẩu
            this.textContent = '👁️';     // Đổi biểu tượng
        }
    });
</script>

</body>
</html>
